name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  # "true" = build gagal bila uji asap (smoke test) menemukan error script.
  # Ubah ke "false" jika kamu hanya ingin APK walau ada peringatan.
  STRICT_SMOKE: "true"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cari folder proyek (otomatis ekstrak ZIP bila perlu)
        run: |
          set -eu
          echo "Isi repository:"
          ls -la
          PG=$(find . -maxdepth 3 -name project.godot -not -path "./.git/*" | head -n 1)
          if [ -z "$PG" ]; then
            ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "project.godot belum ada, mengekstrak $ZIP"
              mkdir -p "$RUNNER_TEMP/unzipped"
              unzip -q -o "$ZIP" -d "$RUNNER_TEMP/unzipped"
              PG=$(find "$RUNNER_TEMP/unzipped" -maxdepth 3 -name project.godot | head -n 1)
            fi
          fi
          if [ -z "$PG" ]; then
            echo "::error::project.godot tidak ditemukan (juga tidak ada ZIP proyek). Unggah OperationDeadZone.zip atau semua isi foldernya ke repository."
            find . -maxdepth 3 -not -path "./.git/*" | head -n 60
            exit 1
          fi
          DIR=$(cd "$(dirname "$PG")" && pwd)
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Folder proyek: $DIR"
          ls "$DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Godot dan export template
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL_DIR/"
          godot --version
          ls "$TPL_DIR" | head -n 20

      - name: Pasang Android SDK yang dibutuhkan Godot 4.3
        run: |
          set -eu
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313" > /dev/null
          echo "SDK siap di $ANDROID_SDK_ROOT"

      - name: Buat debug keystore dan pengaturan editor Godot
        run: |
          set -eu
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.3.tres"
          cp "$HOME/.config/godot/editor_settings-4.3.tres" "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Validasi file proyek
        run: |
          cd "$PROJECT_DIR"
          MISSING=0
          for f in project.godot export_presets.cfg icon.svg \
            scenes/main/main_menu.tscn scenes/levels/vesper.tscn scenes/player/player.tscn \
            scenes/enemies/enemy.tscn scenes/weapons/weapon_holder.tscn scenes/ui/hud.tscn scenes/ui/pause_menu.tscn \
            scripts/gameplay/settings.gd scripts/gameplay/sfx.gd scripts/gameplay/game.gd scripts/gameplay/level.gd \
            scripts/gameplay/map_builder.gd scripts/gameplay/mission.gd scripts/gameplay/texlib.gd scripts/gameplay/fx.gd \
            scripts/player/player.gd scripts/enemies/enemy.gd scripts/weapons/weapon_holder.gd scripts/weapons/weapon_models.gd \
            scripts/ui/hud.gd scripts/ui/pause_menu.gd scripts/ui/main_menu.gd scripts/ui/ui_kit.gd scripts/ui/touch_controls.gd scripts/ui/crosshair.gd; do
            if [ ! -f "$f" ]; then
              echo "::error::File hilang: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "Isi folder proyek:"
            find . -maxdepth 3 -not -path "./.git/*" | sort | head -n 80
            exit 1
          fi
          echo "Struktur proyek OK"

      - name: Impor resource
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --import > import.log 2>&1 || true
          godot --headless --path . --import >> import.log 2>&1 || true
          tail -n 40 import.log

      - name: Uji asap (muat menu, bangun level, tembak, selesaikan misi)
        run: |
          cd "$PROJECT_DIR"
          set +e
          timeout 180 godot --headless --path . -- --smoke > smoke.log 2>&1
          cat smoke.log | tail -n 80
          ERR=$(grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Cannot open file|Invalid call|Invalid access|Invalid get index|Invalid set index|Nonexistent function" smoke.log import.log | head -n 30)
          OK=$(grep -c "SMOKE: ok" smoke.log)
          if [ -n "$ERR" ] || [ "$OK" = "0" ]; then
            echo "::warning::Uji asap menemukan masalah:"
            echo "$ERR"
            if [ "$STRICT_SMOKE" = "true" ]; then
              echo "::error::Uji asap gagal. Lihat smoke.log pada artifact logs."
              exit 1
            fi
          fi
          exit 0

      - name: Export APK Android (arm64)
        run: |
          set -eu
          cd "$PROJECT_DIR"
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/OperationDeadZone.apk 2>&1 | tee export.log
          test -s build/OperationDeadZone.apk

      - name: Periksa APK
        run: |
          set -eu
          cd "$PROJECT_DIR"
          ls -la build/
          unzip -tq build/OperationDeadZone.apk
          unzip -l build/OperationDeadZone.apk | grep -E "lib/arm64-v8a/.*\.so" | head -n 3
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose build/OperationDeadZone.apk | head -n 8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OperationDeadZone-APK
          path: ${{ env.PROJECT_DIR }}/build/OperationDeadZone.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.PROJECT_DIR }}/import.log
            ${{ env.PROJECT_DIR }}/smoke.log
            ${{ env.PROJECT_DIR }}/export.log
          if-no-files-found: ignore
