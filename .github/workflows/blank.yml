name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  # "true" = build gagal bila uji asap (smoke test) menemukan error script.
  # Ubah ke "false" jika kamu hanya ingin APK walau ada peringatan.
  STRICT_SMOKE: "true"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Godot dan export template
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL_DIR/"
          godot --version
          ls "$TPL_DIR" | head -n 20

      - name: Pasang Android SDK yang dibutuhkan Godot 4.3
        run: |
          set -eu
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313" > /dev/null
          echo "SDK siap di $ANDROID_SDK_ROOT"

      - name: Buat debug keystore dan pengaturan editor Godot
        run: |
          set -eu
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.3.tres"
          cp "$HOME/.config/godot/editor_settings-4.3.tres" "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Validasi file proyek
        run: |
          set -eu
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main/main_menu.tscn
          test -f scenes/levels/vesper.tscn
          echo "Struktur proyek OK"

      - name: Impor resource
        run: |
          godot --headless --path . --import > import.log 2>&1 || true
          godot --headless --path . --import >> import.log 2>&1 || true
          tail -n 40 import.log

      - name: Uji asap (muat menu, bangun level, tembak, selesaikan misi)
        run: |
          set +e
          timeout 180 godot --headless --path . -- --smoke > smoke.log 2>&1
          cat smoke.log | tail -n 80
          ERR=$(grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Cannot open file|Invalid call|Invalid access|Invalid get index|Invalid set index|Nonexistent function" smoke.log import.log | head -n 30)
          OK=$(grep -c "SMOKE: ok" smoke.log)
          if [ -n "$ERR" ] || [ "$OK" = "0" ]; then
            echo "::warning::Uji asap menemukan masalah:"
            echo "$ERR"
            if [ "$STRICT_SMOKE" = "true" ]; then
              echo "::error::Uji asap gagal. Lihat smoke.log pada artifact logs."
              exit 1
            fi
          fi
          exit 0

      - name: Export APK Android (arm64)
        run: |
          set -eu
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/OperationDeadZone.apk 2>&1 | tee export.log
          test -s build/OperationDeadZone.apk

      - name: Periksa APK
        run: |
          set -eu
          ls -la build/
          unzip -tq build/OperationDeadZone.apk
          unzip -l build/OperationDeadZone.apk | grep -E "lib/arm64-v8a/.*\.so" | head -n 3
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose build/OperationDeadZone.apk | head -n 8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OperationDeadZone-APK
          path: build/OperationDeadZone.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            import.log
            smoke.log
            export.log
          if-no-files-found: ignore
